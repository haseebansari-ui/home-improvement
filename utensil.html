<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Services - Home Improvement</title>

<!-- GOOGLE FONT -->
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- FONT AWESOME -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.partner-section {
    padding: 80px 20px;
    background: #f8fafc;
}

.partner-container {
    max-width: 900px;
    margin: auto;
    background: #fff;
    padding: 50px;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.08);
}

.partner-header {
    text-align: center;
    margin-bottom: 40px;
}

.partner-header h2 {
    font-size: 42px;
    color: #0f172a;
    margin-bottom: 12px;
}

.partner-header p {
    color: #64748b;
    font-size: 16px;
}

.partner-form {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.full-width {
    grid-column: 1 / -1;
}

.partner-form input,
.partner-form select,
.partner-form textarea {
    width: 100%;
    padding: 16px 18px;
    border: 1px solid #dbe3ee;
    border-radius: 12px;
    outline: none;
    font-size: 15px;
    transition: 0.3s;
}

.partner-form input:focus,
.partner-form select:focus,
.partner-form textarea:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 4px rgba(37,99,235,.12);
}

.partner-form textarea {
    resize: vertical;
}

.partner-form button {
    border: none;
    cursor: pointer;
    padding: 16px 28px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(
        135deg,
        #2563eb,
        #ed9121
    );
    transition: .3s;
}

.partner-form button:hover {
    transform: translateY(-3px);
}

@media (max-width: 768px) {
    .partner-container {
        padding: 30px;
    }

    .partner-form {
        grid-template-columns: 1fr;
    }

    .full-width {
        grid-column: auto;
    }

    .partner-header h2 {
        font-size: 32px;
    }
}
</style>
</head>

<body>

<section class="partner-section">
    <div class="partner-container">
        <div class="partner-header">
            <h2>Become a Partner</h2>
            <p>Join our network of trusted professionals and grow your business with us.</p>
        </div>

        <form class="partner-form">
            <div class="form-group">
                <input type="text" placeholder="Full Name" required>
            </div>

            <div class="form-group">
                <input type="email" placeholder="Email Address" required>
            </div>

            <div class="form-group">
                <input type="tel" placeholder="Phone Number" required>
            </div>

            <div class="form-group">
                <input type="text" placeholder="Company Name">
            </div>

            <div class="form-group">
                <select required>
                    <option value="">Select Service Type</option>
                    <option>General Contractor</option>
                    <option>Plumber</option>
                    <option>Electrician</option>
                    <option>Painter</option>
                    <option>Carpenter</option>
                    <option>HVAC Technician</option>
                    <option>Landscaping</option>
                </select>
            </div>

            <div class="form-group">
                <input type="text" placeholder="City / Service Area">
            </div>

            <div class="form-group full-width">
                <textarea rows="5" placeholder="Tell us about your business"></textarea>
            </div>

            <div class="form-group full-width">
                <button type="submit">
                    Become a Partner
                </button>
            </div>
        </form>
    </div>
</section>



</body>
</html>
