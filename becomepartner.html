<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Cuprum:ital,wght@0,400..700;1,400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css"/>
    <link rel="stylesheet" href="css/media.css"/>    
</head>
<body>

    <header class="header-bx">
        <div class="container-fluid">
            <div class="nav-container">
                <div class="nav-links-bx">
                    <div class="logo-bx">
                        <a href="index.html" class="logo"> HomeFix </a>
                    </div>
                </div>
            </div>
        </div>
    </header>



    <main>
        <!-- Become partner Section -->
        <section class="partner-section sec-padding">
          <div class="partner-container">
                <div class="partner-header">
                    <h2>Become a Partner</h2>
                    <p>Join our network of trusted professionals and grow your business with us.</p>
                </div>
                <div class="error-class">Error</div>
                <form class="partner-form">
                    <div class="form-group">
                        <input type="text" placeholder="Full Name" required>
                    </div>

                    <div class="form-group">
                        <input type="email" placeholder="Email Address" required>
                    </div>

                    <div class="form-group">
                        <input type="tel" placeholder="Phone Number" required>
                    </div>

                    <div class="form-group">
                        <input type="text" placeholder="Company Name">
                    </div>

                    <div class="form-group">
                        <select required>
                            <option value="">Select Service Type</option>
                            <option>Roofing</option>
                            <option>Windows & Doors</option>
                            <option>HVAC</option>
                            <option>Kitchen Remodeling</option>
                            <option>Bathroom Remodeling</option>
                            <option>Solar</option>
                            <option>Flooring</option>
                            <option>Home Exterior</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <input type="text" placeholder="City / Service Area">
                    </div>

                    <div class="form-group full-width">
                        <textarea rows="5" placeholder="Tell us about your business" maxlength="150"></textarea>
                    </div>

                    <div class="form-group full-width">
                        <button type="submit">
                            Become a Partner
                        </button>
                    </div>
                </form>
          </div>
        </section>
        

     <script src="js/script.js"></script>
</body>
</html>
